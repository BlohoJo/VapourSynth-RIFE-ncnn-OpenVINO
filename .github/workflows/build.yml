name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  OPENVINO_VERSION: 2026.4.1
  OPENVINO_BUILD: 22982.07f9c262b05
  OPENVINO_BASE: https://storage.openvinotoolkit.org/repositories/openvino/packages

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download OpenVINO runtime
        run: |
          curl -sSL -o openvino.tgz "$OPENVINO_BASE/$OPENVINO_VERSION/linux/openvino_toolkit_ubuntu24_${OPENVINO_VERSION}.${OPENVINO_BUILD}_x86_64.tgz"
          mkdir openvino && tar xzf openvino.tgz -C openvino --strip-components=1

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOpenVINO_DIR="$PWD/openvino/runtime/cmake"
          cmake --build build --config Release -j"$(nproc)"

      - name: Package
        run: |
          set -e
          D=dist/VapourSynth-RIFE-OpenVINO-linux-x64
          OV=openvino/runtime/lib/intel64
          mkdir -p "$D"
          cp build/librife_openvino.so "$D/"
          # Runtime libraries needed next to the plugin (or on LD_LIBRARY_PATH).
          # OpenVINO >= 2024 registers plugins statically; there is no plugins.xml any more
          # (cache.json is its optional successor and is copied when present).
          # (cp -a keeps the soname symlinks instead of duplicating the libraries.)
          cp -a "$OV"/libopenvino.so.* "$D/"
          cp -a "$OV"/libopenvino_intel_cpu_plugin.so "$D/"
          cp -a "$OV"/libopenvino_onnx_frontend.so.* "$D/"
          cp -a "$OV"/libopenvino_ir_frontend.so.* "$D/"
          [ -f "$OV/cache.json" ] && cp "$OV/cache.json" "$D/" || true
          cp -a openvino/runtime/3rdparty/tbb/lib/libtbb.so.* "$D/"
          cp LICENSE README.md "$D/"
          cp -r scripts "$D/"
          ls -l "$D"
          (cd dist && tar czf VapourSynth-RIFE-OpenVINO-linux-x64.tar.gz VapourSynth-RIFE-OpenVINO-linux-x64)

      - name: Smoke test packaged plugin
        run: |
          set -e
          D=dist/VapourSynth-RIFE-OpenVINO-linux-x64
          # Every shared-library dependency must resolve from the package directory alone.
          ldd "$D/librife_openvino.so"
          if ldd "$D/librife_openvino.so" | grep -q "not found"; then echo "unresolved dependency"; exit 1; fi
          # libopenvino and libtbb must come from the package itself (via the $ORIGIN rpath),
          # not from whatever the runner happens to have installed system-wide.
          for lib in libopenvino.so libtbb.so; do
            ldd "$D/librife_openvino.so" | grep "$lib" | grep -q "$D/" || { echo "$lib not resolved from the package dir"; exit 1; }
          done
          # The plugin must be loadable with only the packaged runtime next to it ($ORIGIN rpath).
          python3 -c "import ctypes,sys; l=ctypes.CDLL(sys.argv[1]); l.VapourSynthPluginInit2; print('plugin loaded OK')" "$PWD/$D/librife_openvino.so"

      - uses: actions/upload-artifact@v4
        with:
          name: VapourSynth-RIFE-OpenVINO-linux-x64
          path: dist/VapourSynth-RIFE-OpenVINO-linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download OpenVINO runtime
        shell: pwsh
        run: |
          $url = "$env:OPENVINO_BASE/$env:OPENVINO_VERSION/windows/openvino_toolkit_windows_$($env:OPENVINO_VERSION).$($env:OPENVINO_BUILD)_x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile openvino.zip
          Expand-Archive openvino.zip -DestinationPath ov_tmp
          $inner = Get-ChildItem ov_tmp | Select-Object -First 1
          Move-Item $inner.FullName openvino

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DOpenVINO_DIR="$PWD/openvino/runtime/cmake"
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $D  = "dist/VapourSynth-RIFE-OpenVINO-win64"
          $OV = "openvino/runtime/bin/intel64/Release"
          New-Item -ItemType Directory -Force $D | Out-Null
          Copy-Item build/Release/RIFE-OpenVINO.dll $D/
          # Runtime DLLs needed next to the plugin (or on PATH).
          # OpenVINO >= 2024 registers plugins statically; there is no plugins.xml any more
          # (cache.json is its optional successor and is copied when present).
          foreach ($f in "openvino.dll", "openvino_intel_cpu_plugin.dll", "openvino_onnx_frontend.dll", "openvino_ir_frontend.dll") {
            Copy-Item "$OV/$f" $D/
          }
          if (Test-Path "$OV/cache.json") { Copy-Item "$OV/cache.json" $D/ }
          # openvino.dll and the CPU plugin import tbb12.dll; tbbbind is loaded on demand for NUMA pinning.
          foreach ($f in "tbb12.dll", "tbbbind_2_5.dll", "tbbmalloc.dll", "tbbmalloc_proxy.dll") {
            if (Test-Path "openvino/runtime/3rdparty/tbb/bin/$f") { Copy-Item "openvino/runtime/3rdparty/tbb/bin/$f" $D/ }
          }
          if (-not (Test-Path "$D/tbb12.dll")) { throw "tbb12.dll not found in the OpenVINO archive" }
          Copy-Item LICENSE, README.md $D/
          Copy-Item -Recurse scripts $D/
          Get-ChildItem $D
          Compress-Archive -Path $D -DestinationPath dist/VapourSynth-RIFE-OpenVINO-win64.zip

      - name: Smoke test packaged plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $D = (Resolve-Path "dist/VapourSynth-RIFE-OpenVINO-win64").Path
          # Load the DLL with only the package directory as the search path: this fails if any
          # OpenVINO/TBB DLL is missing from the package.
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public static class L {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)] public static extern bool SetDllDirectory(string p);
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibrary(string p);
            [DllImport("kernel32", CharSet=CharSet.Ansi)] public static extern IntPtr GetProcAddress(IntPtr h, string n);
          }
          "@
          Add-Type -TypeDefinition $sig
          [L]::SetDllDirectory($D) | Out-Null
          $h = [L]::LoadLibrary((Join-Path $D "RIFE-OpenVINO.dll"))
          if ($h -eq [IntPtr]::Zero) { throw "LoadLibrary failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          if ([L]::GetProcAddress($h, "VapourSynthPluginInit2") -eq [IntPtr]::Zero) { throw "VapourSynthPluginInit2 export missing" }
          "RIFE-OpenVINO.dll loaded OK from $D"

      - uses: actions/upload-artifact@v4
        with:
          name: VapourSynth-RIFE-OpenVINO-win64
          path: dist/VapourSynth-RIFE-OpenVINO-win64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
